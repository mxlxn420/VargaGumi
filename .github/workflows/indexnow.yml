# Minden sikeres éles Vercel-deploy után elküldi a sitemap URL-jeit az IndexNow-nak (Bing stb.)
name: IndexNow

on:
  deployment_status:

jobs:
  submit:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
